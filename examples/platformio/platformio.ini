; Pisco-Code — PlatformIO Example
; Demonstrates displaying numeric diagnostic codes via a single status LED.
;
; Supported environments:
;   uno        — Arduino Nano / Uno (ATmega328p, AVR)
;   esp32dev   — ESP32 DevKit
;
; Build all:   platformio run
; Build one:   platformio run -e uno

[platformio]
default_envs = uno, esp32dev

[common]
build_flags    = -std=gnu++17
# Explicitly reference the library root so PlatformIO reads library.json
# and compiles src/*.cpp — lib_extra_dirs alone only scans subdirectories.
lib_deps       = file://../..

[env:uno]
platform       = atmelavr
board          = nanoatmega328
framework      = arduino
build_unflags  = -std=gnu++11 -std=c++11
build_flags    = ${common.build_flags}
lib_deps       = ${common.lib_deps}

[env:esp32dev]
platform       = espressif32
board          = esp32dev
framework      = arduino
build_unflags  = -std=gnu++11 -std=c++11
build_flags    = ${common.build_flags}
lib_deps       = ${common.lib_deps}
